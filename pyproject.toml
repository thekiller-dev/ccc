[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph"
version = "0.2.0"
description = "Local-first static knowledge graphs for JavaScript and TypeScript projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "networkx>=3.4",
  # tree-sitter 0.26.0 reproducibly segfaults traversing frontend TSX ASTs.
  "tree-sitter>=0.25.2,<0.26",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
codegraph = "codegraph.cli:main"
codegraph-api = "codegraph.api:run"

[tool.setuptools.packages.find]
include = ["codegraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
